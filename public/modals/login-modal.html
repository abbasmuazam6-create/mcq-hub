<!-- ==================== STANDALONE LOGIN MODAL ==================== -->
<div
  id="loginModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="loginModalTitle"
  class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md"
>
  <div class="modal-panel w-full max-w-md relative">
    <div class="auth-glow-wrapper shadow-2xl shadow-indigo-950/50">
      <div class="card glass-card rounded-[26px] p-6 sm:p-8 relative">
        <!-- Close Button -->
        <button
          type="button"
          data-close-modal="loginModal"
          aria-label="Close login modal"
          class="absolute top-5 right-5 w-9 h-9 rounded-xl flex items-center justify-center bg-slate-200/80 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 hover:bg-rose-500/15 hover:text-rose-500 transition-colors"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6 pr-10">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 p-0.5 flex items-center justify-center shadow-md overflow-hidden shrink-0">
            <div class="w-full h-full rounded-[10px] bg-slate-900 flex items-center justify-center overflow-hidden">
              <img
                src="assets/images/logo.png"
                alt="Topper Hub"
                class="w-7 h-7 object-contain"
                onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
              />
              <svg class="hidden w-6 h-6" viewBox="0 0 64 64" fill="none">
                <path d="M32 10L6 23L32 36L58 23L32 10Z" fill="#818cf8" />
                <path d="M16 30V43C16 47.5 23.2 52 32 52C40.8 52 48 47.5 48 43V30L32 38L16 30Z" fill="#22d3ee" />
              </svg>
            </div>
          </div>
          <div>
            <h2 id="loginModalTitle" class="font-display font-bold text-lg leading-tight">Student Login</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Sign in to access your tests & bookmarks</p>
          </div>
        </div>

        <!-- Global Notice Banner (#notice) -->
        <div id="notice" class="notice" hidden></div>

        <!-- LOGIN FORM (#loginForm) -->
        <form id="loginForm" class="form-stack">
          <label class="field-label text-slate-700 dark:text-slate-300">
            <span>Email</span>
            <div class="relative">
              <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input
                type="email"
                id="lEmail"
                autocomplete="username"
                placeholder="student@topperhub.com"
                required
                class="!pl-10 bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-white"
              />
            </div>
          </label>

          <label class="field-label text-slate-700 dark:text-slate-300">
            <span>Password</span>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input
                type="password"
                id="lPass"
                autocomplete="current-password"
                placeholder="••••••••"
                required
                class="!pl-10 !pr-10 bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-white"
              />
              <button
                type="button"
                data-toggle-pass="lPass"
                aria-label="Toggle password visibility"
                class="toggle-pass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-400 text-xs"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </label>

          <div class="err" id="lErr"></div>

          <button
            class="btn btn-ripple py-3 px-5 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 shadow-lg shadow-indigo-600/25 transition-all hover:-translate-y-0.5 flex items-center justify-center gap-2"
            style="width:100%"
            id="lBtn"
            type="submit"
          >
            <span>Login</span>
            <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
          </button>

          <div class="text-center pt-1">
            <a href="#" id="forgot" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
              Forgot password?
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
