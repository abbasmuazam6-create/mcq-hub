<!doctype html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>MCQ Hub — Smart Practice & Analytics</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          animation: {
            'spin-slow': 'spin 10s linear infinite',
            'blob': 'blob 12s infinite alternate',
            'float': 'float 6s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(35px, -45px) scale(1.12)' },
              '66%': { transform: 'translate(-25px, 25px) scale(0.92)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.5', transform: 'scale(0.96)' },
              '50%': { opacity: '1', transform: 'scale(1.06)' },
            }
          }
        }
      }
    };
  </script>
  
  <link rel="modulepreload" href="js/core/dom.js">
  <link rel="modulepreload" href="js/core/cache.js">
  <link rel="modulepreload" href="js/core/store.js">
  <link rel="modulepreload" href="js/core/router.js">
  <link rel="modulepreload" href="js/core/firebase.js">
  <link rel="modulepreload" href="js/common.js">
  <link rel="modulepreload" href="js/views/app.js">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  
  <link rel="stylesheet" href="css/style.css?v=7">
  <link rel="stylesheet" href="css/student.css?v=7">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-sidebar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(226, 232, 240, 0.8);
    }
    .dark .glass-sidebar {
      background: rgba(15, 23, 42, 0.82);
      border-right: 1px solid rgba(99, 102, 241, 0.18);
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
    .dark .glass-header {
      background: rgba(15, 23, 42, 0.78);
      border-bottom: 1px solid rgba(99, 102, 241, 0.18);
    }
    .brand span {
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((r) => r.forEach((x) => x.unregister()));
    if (window.caches) caches.keys().then((k) => k.forEach((x) => caches.delete(x)));
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#070b14] dark:text-slate-100 min-h-screen transition-colors duration-300 selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Background Orbs -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -left-24 w-[28rem] h-[28rem] rounded-full bg-indigo-500/15 blur-3xl animate-blob"></div>
    <div class="absolute top-1/3 -right-24 w-[30rem] h-[30rem] rounded-full bg-cyan-500/10 blur-3xl animate-blob" style="animation-delay: 2.5s;"></div>
  </div>

  <div class="shell" id="shell">
    <!-- Desktop Sidebar -->
    <aside class="side glass-sidebar">
      <div class="brand">
        <div class="brand-mark w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600/20 to-cyan-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400" aria-hidden="true">
          <i class="fa-solid fa-graduation-cap text-sm"></i>
        </div>
        <span class="lbl font-display font-extrabold">MCQ <span>Hub</span></span>
        <div class="brand-controls">
          <!-- Desktop Dark Mode Toggle -->
          <button class="btn ghost sm icon-btn theme-toggle-btn" id="themeToggle" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon text-xs"></i>
          </button>
          <button class="pin" id="pin" type="button" title="Pin sidebar" aria-label="Pin sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
        </div>
      </div>

      <nav id="nav" aria-label="Main"></nav>

      <div class="me">
        <div class="av" data-av>S</div>
        <div class="me-t">
          <b id="who" class="font-display">Loading...</b>
          <small><span class="status-dot"></span>Student</small>
        </div>
        <button class="btn ghost sm icon-btn" data-logout type="button" title="Logout" aria-label="Logout">
          <i class="fa-solid fa-right-from-bracket text-xs"></i>
        </button>
      </div>
    </aside>

    <!-- Main Column -->
    <div class="col">
      <header class="mtop glass-header">
        <div class="brand">
          <div class="brand-mark sm w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600/20 to-cyan-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400" aria-hidden="true">
            <i class="fa-solid fa-graduation-cap text-xs"></i>
          </div>
          <span class="lbl font-display font-extrabold">MCQ <span>Hub</span></span>
        </div>
        <div class="mtop-actions">
          <!-- Mobile Header Dark Mode Toggle -->
          <button class="btn ghost sm icon-btn theme-toggle-btn mobile-toggle" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon text-xs"></i>
          </button>
          <a href="admin.html" class="btn ghost sm" data-admin hidden>Admin</a>
          <button class="av" data-av data-logout type="button" title="Log out" aria-label="Log out">S</button>
        </div>
      </header>

      <main class="main wide-container" id="view" aria-live="polite">
        <div class="sk-wrap">
          <div class="sk sk-hero wide-banner"></div>
          <div class="sk-kpi-row">
            <div class="sk sk-kpi"></div><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <nav class="tabbar glass-header" id="tabbar" aria-label="Tabs"></nav>
  <div class="sheet" id="more" hidden>
    <div class="sheet-card" id="moreList"></div>
  </div>
  <dialog id="dlg"></dialog>

  <script type="module" src="js/views/app.js"></script>
</body>
</html>
