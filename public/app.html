<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>MCQ Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="modulepreload" href="js/core/dom.js">
  <link rel="modulepreload" href="js/core/cache.js">
  <link rel="modulepreload" href="js/core/store.js">
  <link rel="modulepreload" href="js/core/router.js">
  <link rel="modulepreload" href="js/core/firebase.js">
  <link rel="modulepreload" href="js/common.js">
  <link rel="modulepreload" href="js/views/app.js">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="stylesheet" href="css/student.css?v=4">
  <script>
    /* TEMP: clears stale service-worker caches while redesigning. Remove once the new look shows. */
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((r) => r.forEach((x) => x.unregister()));
    if (window.caches) caches.keys().then((k) => k.forEach((x) => caches.delete(x)));
  </script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="side">
      <div class="brand"><span class="lbl">MCQ <em>Hub</em></span><button class="pin" id="pin" type="button" title="Pin sidebar" aria-label="Pin sidebar">📌</button></div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="me"><div class="av" data-av>S</div><div class="me-t"><b id="who"></b><small>Student</small></div><button class="btn ghost sm" data-logout type="button">Logout</button></div>
    </aside>
    <div class="col">
      <header class="mtop"><div class="brand"><span class="lbl">MCQ <em>Hub</em></span></div><a href="admin.html" class="btn ghost sm" data-admin hidden>Admin</a><button class="av" data-av data-logout type="button" aria-label="Log out"></button></header>
      <main class="main" id="view" aria-live="polite"><div class="sk sk-hero"></div></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
  <div class="sheet" id="more" hidden><div class="sheet-card" id="moreList"></div></div>
  <dialog id="dlg"></dialog>
  <script type="module" src="js/views/app.js"></script>
<script>
  addEventListener("load", () => {
    const sh = document.querySelector(".shell");
    if (sh && innerWidth > 860 && getComputedStyle(sh).display !== "grid")
      document.body.insertAdjacentHTML("afterbegin", '<div style="padding:10px 14px;background:#d92d20;color:#fff;font:600 14px system-ui">css/student.css did not load. Check that it is saved at css/student.css, then hard-refresh.</div>');
  });
</script>
</body>
</html>
